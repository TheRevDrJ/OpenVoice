[project]
name = "openvoice-voxcpm"
version = "0.1.0"
description = "VoxCPM voice-design worker env (separate from the Chatterbox backend)"
license = "AGPL-3.0-or-later"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.49",
    "pydantic>=2",
    "soundfile",
    "numpy",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "voxcpm",
]

# CUDA 12.4 torch (not the CPU PyPI wheels).
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
