[project]
name = "openvoice-server"
version = "0.1.0"
description = "OpenVoice — self-hosted text-to-speech and voice cloning backend"
license = "AGPL-3.0-or-later"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.49",
    "pydantic>=2",
    "python-multipart>=0.0.32",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "chatterbox-tts>=0.1.7",
    "setuptools<81",  # perth watermarker imports pkg_resources (dropped in setuptools 81+)
]

# Pull torch/torchaudio from the CUDA 12.4 index, not PyPI (CPU-only) wheels.
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
